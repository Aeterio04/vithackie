[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kawach-mcp"
version = "0.1.0"
description = "MCP server exposing the KAWACH / Ordinous AI QA platform to coding agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.scripts]
kawach-mcp = "kawach_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["kawach_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
