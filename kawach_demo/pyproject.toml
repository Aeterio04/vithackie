[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kawach_demo"
version = "0.1.0"
description = "Demonstration harness for Kawach Fix Pipeline against target application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kawach_fix",
    "rich>=13.7.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
kawach-demo = "kawach_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "asyncio: mark test as asyncio coroutine",
]
