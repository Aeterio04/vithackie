[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kawach"
version = "0.1.0"
description = "Autonomous AI QA Engineer API & Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "langgraph",
    "anthropic",
    "openai",
    "python-dotenv",
    "httpx",
    "python-multipart",
    "import-linter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
