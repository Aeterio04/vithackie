[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kawach-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Kawach Autonomous QA Engineer"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27.0",
    "python-dotenv",
]

[project.scripts]
kawach-mcp = "kawach_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
